<svg width="440" height="640" viewBox="0 0 440 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2013"/>
      <stop offset="55%" stop-color="#20180E"/>
      <stop offset="100%" stop-color="#140F08"/>
    </linearGradient>
    <radialGradient id="vignette" cx="52%" cy="40%" r="70%">
