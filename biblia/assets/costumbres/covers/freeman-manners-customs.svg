      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E3B22"/>
      <stop offset="50%" stop-color="#7A4E2E"/>
      <stop offset="100%" stop-color="#5A3A24"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C355"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7C1C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="26" height="640" fill="url(#spineGrad)"/>
  <rect x="21" y="0" width="5" height="640" fill="#2A1A0E" opacity="0.5"/>
  <rect x="0" y="96" width="26" height="4" fill="#C9A227" opacity="0.35"/>
  <rect x="0" y="320" width="26" height="4" fill="#C9A227" opacity="0.35"/>
  <rect x="0" y="544" width="26" height="4" fill="#C9A227" opacity="0.35"/>

  <rect x="26" y="0" width="414" height="640" fill="url(#coverGrad)"/>
  <rect x="26" y="0" width="414" height="640" fill="url(#vignette)"/>

  <rect x="52" y="36" width="362" height="568" fill="none" stroke="url(#goldLine)" stroke-width="2.2"/>
  <rect x="60" y="44" width="346" height="552" fill="none" stroke="url(#goldLine)" stroke-width="1" opacity="0.7"/>

  <g stroke="url(#goldLine)" stroke-width="1.3" fill="none" opacity="0.9">
    <circle cx="52" cy="36" r="3.5"/>
    <circle cx="414" cy="36" r="3.5"/>
    <circle cx="52" cy="604" r="3.5"/>
    <circle cx="414" cy="604" r="3.5"/>
