    <circle r="130" stroke-width="1.4" opacity="0.55"/>
    <circle r="119" stroke-width="0.7" opacity="0.4"/>
    <!-- asas -->
    <path d="M -46 -60 C -78 -50 -80 -6 -50 8"/>
    <path d="M 46 -60 C 78 -50 80 -6 50 8"/>
    <!-- cuerpo de la vasija -->
    <path d="M -18 -96 L 18 -96 L 22 -78 L 34 -62 C 58 -26 58 40 30 78 C 16 98 -16 98 -30 78 C -58 40 -58 -26 -34 -62 L -22 -78 Z"/>
    <!-- cuello y boca -->
    <path d="M -14 -96 L -14 -112 L 14 -112 L 14 -96"/>
    <line x1="-20" y1="-112" x2="20" y2="-112"/>
    <!-- líneas decorativas -->
    <line x1="-40" y1="-4" x2="40" y2="-4" opacity="0.6"/>
    <line x1="-46" y1="30" x2="46" y2="30" opacity="0.6"/>
  </g>

  <line x1="120" y1="500" x2="346" y2="500" stroke="url(#goldLine)" stroke-width="1" opacity="0.4"/>
