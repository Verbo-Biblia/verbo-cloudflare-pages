<svg width="440" height="640" viewBox="0 0 440 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2024"/>
      <stop offset="55%" stop-color="#131718"/>
      <stop offset="100%" stop-color="#0C0E0F"/>
    </linearGradient>
    <radialGradient id="vignette3" cx="52%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#233038" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22383E"/>
      <stop offset="50%" stop-color="#2E4A52"/>
      <stop offset="100%" stop-color="#20363C"/>
    </linearGradient>
    <linearGradient id="goldLine3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C355"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7C1C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="26" height="640" fill="url(#spineGrad3)"/>
  <rect x="21" y="0" width="5" height="640" fill="#0F1A1D" opacity="0.5"/>
  <rect x="0" y="96" width="26" height="4" fill="#C9A227" opacity="0.35"/>
  <rect x="0" y="320" width="26" height="4" fill="#C9A227" opacity="0.35"/>
  <rect x="0" y="544" width="26" height="4" fill="#C9A227" opacity="0.35"/>

  <rect x="26" y="0" width="414" height="640" fill="url(#coverGrad3)"/>
  <rect x="26" y="0" width="414" height="640" fill="url(#vignette3)"/>

  <rect x="52" y="36" width="362" height="568" fill="none" stroke="url(#goldLine3)" stroke-width="2.2"/>
  <rect x="60" y="44" width="346" height="552" fill="none" stroke="url(#goldLine3)" stroke-width="1" opacity="0.7"/>

  <g stroke="url(#goldLine3)" stroke-width="1.3" fill="none" opacity="0.9">
    <circle cx="52" cy="36" r="3.5"/>
    <circle cx="414" cy="36" r="3.5"/>
    <circle cx="52" cy="604" r="3.5"/>
    <circle cx="414" cy="604" r="3.5"/>
  </g>

  <!-- CENTRAL SIGNATURE: libro abierto con marcapáginas, símbolo neutral de obra
       de referencia/diccionario (no imaginería doctrinal) -->
  <g transform="translate(233,300)" stroke="url(#goldLine3)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <circle r="130" stroke-width="1.4" opacity="0.55"/>
    <circle r="119" stroke-width="0.7" opacity="0.4"/>
    <!-- tapas del libro abierto -->
    <path d="M -104 -66 C -60 -84 -22 -78 0 -62 C 22 -78 60 -84 104 -66 L 104 70 C 60 52 22 58 0 74 C -22 58 -60 52 -104 70 Z"/>
    <!-- lomo central -->
    <line x1="0" y1="-62" x2="0" y2="74"/>
    <!-- líneas de texto, página izquierda -->
    <line x1="-84" y1="-40" x2="-16" y2="-52" stroke-width="1.1" opacity="0.65"/>
    <line x1="-84" y1="-16" x2="-16" y2="-28" stroke-width="1.1" opacity="0.65"/>
    <line x1="-84" y1="8" x2="-16" y2="-4" stroke-width="1.1" opacity="0.65"/>
    <line x1="-84" y1="32" x2="-16" y2="20" stroke-width="1.1" opacity="0.65"/>
    <!-- líneas de texto, página derecha -->
    <line x1="16" y1="-52" x2="84" y2="-40" stroke-width="1.1" opacity="0.65"/>
    <line x1="16" y1="-28" x2="84" y2="-16" stroke-width="1.1" opacity="0.65"/>
    <line x1="16" y1="-4" x2="84" y2="8" stroke-width="1.1" opacity="0.65"/>
    <line x1="16" y1="20" x2="84" y2="32" stroke-width="1.1" opacity="0.65"/>
    <!-- marcapáginas -->
    <path d="M 46 -86 L 46 -20 L 58 -34 L 70 -20 L 70 -86 Z" stroke-width="1.6"/>
  </g>

  <line x1="120" y1="500" x2="346" y2="500" stroke="url(#goldLine3)" stroke-width="1" opacity="0.4"/>
</svg>
