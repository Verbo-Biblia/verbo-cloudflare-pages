<svg width="440" height="640" viewBox="0 0 440 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241A1A"/>
      <stop offset="55%" stop-color="#1B1313"/>
      <stop offset="100%" stop-color="#100C0C"/>
    </linearGradient>
    <radialGradient id="vignette2" cx="52%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2020" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E2222"/>
      <stop offset="50%" stop-color="#7A2E2E"/>
      <stop offset="100%" stop-color="#5A2424"/>
    </linearGradient>
    <linearGradient id="goldLine2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C355"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9C7C1C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="26" height="640" fill="url(#spineGrad2)"/>
  <rect x="21" y="0" width="5" height="640" fill="#3A1414" opacity="0.5"/>
  <rect x="0" y="96" width="26" height="4" fill="#C9A227" opacity="0.35"/>
  <rect x="0" y="320" width="26" height="4" fill="#C9A227" opacity="0.35"/>
  <rect x="0" y="544" width="26" height="4" fill="#C9A227" opacity="0.35"/>

  <rect x="26" y="0" width="414" height="640" fill="url(#coverGrad2)"/>
  <rect x="26" y="0" width="414" height="640" fill="url(#vignette2)"/>

  <rect x="52" y="36" width="362" height="568" fill="none" stroke="url(#goldLine2)" stroke-width="2.2"/>
  <rect x="60" y="44" width="346" height="552" fill="none" stroke="url(#goldLine2)" stroke-width="1" opacity="0.7"/>

  <g stroke="url(#goldLine2)" stroke-width="1.3" fill="none" opacity="0.9">
    <circle cx="52" cy="36" r="3.5"/>
    <circle cx="414" cy="36" r="3.5"/>
    <circle cx="52" cy="604" r="3.5"/>
    <circle cx="414" cy="604" r="3.5"/>
  </g>

  <!-- CENTRAL SIGNATURE: columnas romanas, símbolo civil neutral (no imaginería doctrinal) -->
  <g transform="translate(233,300)" stroke="url(#goldLine2)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <circle r="130" stroke-width="1.4" opacity="0.55"/>
    <circle r="119" stroke-width="0.7" opacity="0.4"/>
    <!-- entablamento -->
    <line x1="-92" y1="-96" x2="92" y2="-96"/>
    <line x1="-98" y1="-108" x2="98" y2="-108"/>
    <!-- columna izquierda -->
    <path d="M -70 -84 L -70 84"/>
    <path d="M -82 -84 L -58 -84"/>
    <path d="M -82 84 L -58 84"/>
    <path d="M -78 96 L -62 96"/>
    <line x1="-70" y1="-60" x2="-70" y2="60" stroke-width="0.7" opacity="0.5"/>
    <!-- columna central -->
    <path d="M 0 -84 L 0 84"/>
    <path d="M -12 -84 L 12 -84"/>
    <path d="M -12 84 L 12 84"/>
    <path d="M -8 96 L 8 96"/>
    <!-- columna derecha -->
    <path d="M 70 -84 L 70 84"/>
    <path d="M 58 -84 L 82 -84"/>
    <path d="M 58 84 L 82 84"/>
    <path d="M 62 96 L 78 96"/>
    <line x1="70" y1="-60" x2="70" y2="60" stroke-width="0.7" opacity="0.5"/>
    <!-- base -->
    <line x1="-96" y1="104" x2="96" y2="104"/>
    <line x1="-102" y1="112" x2="102" y2="112"/>
  </g>

  <line x1="120" y1="500" x2="346" y2="500" stroke="url(#goldLine2)" stroke-width="1" opacity="0.4"/>
</svg>
