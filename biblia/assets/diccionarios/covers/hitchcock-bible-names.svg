<svg width="440" height="640" viewBox="0 0 440 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGradHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24191A"/>
      <stop offset="55%" stop-color="#1B1213"/>
      <stop offset="100%" stop-color="#120C0C"/>
    </linearGradient>
    <radialGradient id="vignetteHi" cx="52%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3A2620" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spineGradHi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E2A22"/>
      <stop offset="50%" stop-color="#54392C"/>
      <stop offset="100%" stop-color="#38261F"/>
    </linearGradient>
    <linearGradient id="copperLineHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B37E"/>
      <stop offset="50%" stop-color="#C97B3E"/>
      <stop offset="100%" stop-color="#8F4E24"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="26" height="640" fill="url(#spineGradHi)"/>
  <rect x="21" y="0" width="5" height="640" fill="#160E0B" opacity="0.5"/>
  <rect x="0" y="96" width="26" height="4" fill="#C97B3E" opacity="0.35"/>
  <rect x="0" y="320" width="26" height="4" fill="#C97B3E" opacity="0.35"/>
  <rect x="0" y="544" width="26" height="4" fill="#C97B3E" opacity="0.35"/>

  <rect x="26" y="0" width="414" height="640" fill="url(#coverGradHi)"/>
  <rect x="26" y="0" width="414" height="640" fill="url(#vignetteHi)"/>

  <rect x="52" y="36" width="362" height="568" fill="none" stroke="url(#copperLineHi)" stroke-width="2.2"/>
  <rect x="60" y="44" width="346" height="552" fill="none" stroke="url(#copperLineHi)" stroke-width="1" opacity="0.7"/>

  <g stroke="url(#copperLineHi)" stroke-width="1.3" fill="none" opacity="0.9">
    <circle cx="52" cy="36" r="3.5"/>
    <circle cx="414" cy="36" r="3.5"/>
    <circle cx="52" cy="604" r="3.5"/>
    <circle cx="414" cy="604" r="3.5"/>
  </g>

  <!-- CENTRAL SIGNATURE: llave con etiqueta colgante, símbolo neutral de
       "desentrañar el significado" de un nombre (no imaginería doctrinal) -->
  <g transform="translate(233,300)" stroke="url(#copperLineHi)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <circle r="130" stroke-width="1.4" opacity="0.55"/>
    <circle r="119" stroke-width="0.7" opacity="0.4"/>
    <!-- cabeza de la llave -->
    <circle cx="-46" cy="-30" r="30" stroke-width="2.4"/>
    <circle cx="-46" cy="-30" r="11" stroke-width="1.4" opacity="0.7"/>
    <!-- vástago -->
    <line x1="-24" y1="-8" x2="58" y2="74" stroke-width="2.4"/>
    <!-- dientes -->
    <line x1="40" y1="56" x2="58" y2="38" stroke-width="2.2"/>
    <line x1="52" y1="68" x2="70" y2="50" stroke-width="2.2"/>
    <!-- etiqueta con el nombre -->
    <path d="M -70 46 L -18 46 L -4 60 L -18 74 L -70 74 Z" stroke-width="1.6"/>
    <circle cx="-58" cy="60" r="3" stroke-width="1.2"/>
  </g>

  <line x1="120" y1="500" x2="346" y2="500" stroke="url(#copperLineHi)" stroke-width="1" opacity="0.4"/>
</svg>
