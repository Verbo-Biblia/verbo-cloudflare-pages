<svg width="440" height="640" viewBox="0 0 440 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="coverGradSm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C28"/>
      <stop offset="55%" stop-color="#131420"/>
      <stop offset="100%" stop-color="#0C0D16"/>
    </linearGradient>
    <radialGradient id="vignetteSm" cx="52%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#252A44" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spineGradSm" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262B48"/>
      <stop offset="50%" stop-color="#333A5E"/>
      <stop offset="100%" stop-color="#22273F"/>
    </linearGradient>
    <linearGradient id="silverLineSm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8DCEE"/>
      <stop offset="50%" stop-color="#AAB2D4"/>
      <stop offset="100%" stop-color="#767EA6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="26" height="640" fill="url(#spineGradSm)"/>
  <rect x="21" y="0" width="5" height="640" fill="#0E0F1B" opacity="0.5"/>
  <rect x="0" y="96" width="26" height="4" fill="#AAB2D4" opacity="0.35"/>
  <rect x="0" y="320" width="26" height="4" fill="#AAB2D4" opacity="0.35"/>
  <rect x="0" y="544" width="26" height="4" fill="#AAB2D4" opacity="0.35"/>

  <rect x="26" y="0" width="414" height="640" fill="url(#coverGradSm)"/>
  <rect x="26" y="0" width="414" height="640" fill="url(#vignetteSm)"/>

  <rect x="52" y="36" width="362" height="568" fill="none" stroke="url(#silverLineSm)" stroke-width="2.2"/>
  <rect x="60" y="44" width="346" height="552" fill="none" stroke="url(#silverLineSm)" stroke-width="1" opacity="0.7"/>

  <g stroke="url(#silverLineSm)" stroke-width="1.3" fill="none" opacity="0.9">
    <circle cx="52" cy="36" r="3.5"/>
    <circle cx="414" cy="36" r="3.5"/>
    <circle cx="52" cy="604" r="3.5"/>
    <circle cx="414" cy="604" r="3.5"/>
  </g>

  <!-- CENTRAL SIGNATURE: rollo/pergamino con lupa, símbolo neutral de consulta
       y estudio de referencia (no imaginería doctrinal) -->
  <g transform="translate(233,300)" stroke="url(#silverLineSm)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <circle r="130" stroke-width="1.4" opacity="0.55"/>
    <circle r="119" stroke-width="0.7" opacity="0.4"/>
    <!-- pergamino enrollado en ambos extremos -->
    <rect x="-92" y="-46" width="184" height="92" rx="4"/>
    <rect x="-104" y="-58" width="24" height="116" rx="12"/>
    <rect x="80" y="-58" width="24" height="116" rx="12"/>
    <!-- líneas de texto sobre el pergamino -->
    <line x1="-72" y1="-24" x2="60" y2="-24" stroke-width="1.1" opacity="0.65"/>
    <line x1="-72" y1="-4" x2="60" y2="-4" stroke-width="1.1" opacity="0.65"/>
    <line x1="-72" y1="16" x2="30" y2="16" stroke-width="1.1" opacity="0.65"/>
    <!-- lupa superpuesta -->
    <circle cx="34" cy="30" r="34" stroke-width="2.2"/>
    <line x1="58" y1="54" x2="88" y2="84" stroke-width="6" stroke-linecap="round"/>
  </g>

  <line x1="120" y1="500" x2="346" y2="500" stroke="url(#silverLineSm)" stroke-width="1" opacity="0.4"/>
</svg>
