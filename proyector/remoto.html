<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Control remoto — Proyector Verbo</title>
<link rel="stylesheet" href="css/remoto.css" />
</head>
<body>

  <main class="pantalla" id="pantalla-codigo">
    <h1>Control remoto</h1>
    <p>Ingresá el código de 6 dígitos que aparece en la pantalla de la PC, o escaneá el QR desde ahí.</p>
    <form id="form-codigo">
      <input id="input-codigo" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="off" />
      <button class="btn btn-accent" type="submit">Conectar</button>
    </form>
    <div class="estado-conexion" id="estado-conexion-codigo" role="status"></div>
  </main>

  <div class="pantalla-control" id="pantalla-control" hidden>
    <header class="barra-superior">
      <span class="codigo-chico" id="codigo-conectado"></span>
      <button class="btn-chico" id="btn-cambiar-sala" type="button">Cambiar código</button>
    </header>

    <div class="columnas">
      <section class="col-orden">
        <h2>Orden del culto</h2>
        <div class="lista-orden" id="lista-orden">
          <div class="orden-vacio">Nada en el orden del culto todavía.</div>
        </div>
      </section>

      <section class="col-diapositivas">
        <h2>Diapositivas</h2>
        <div class="carrusel-diapositivas" id="carrusel-diapositivas">
          <div class="orden-vacio">Nada seleccionado.</div>
        </div>
      </section>
    </div>

    <section class="seccion-audio">
      <h2>Audio de fondo</h2>
      <div class="audio-controles">
        <button class="btn-audio" id="btn-play-pausa" type="button">▶</button>
        <button class="btn-audio btn-detener" id="btn-detener" type="button">■</button>
        <input id="input-volumen" type="range" min="0" max="100" step="5" value="70" />
        <output id="output-volumen" for="input-volumen">70%</output>
      </div>
    </section>

    <div class="estado-conexion" id="estado-conexion-control" role="status"></div>
  </div>

  <script src="js/proyector-relay.js"></script>
  <script src="js/remoto.js"></script>
</body>
</html>
