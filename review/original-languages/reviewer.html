<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión Interlineal Verbo</title><style>
body{margin:0;font:15px system-ui;background:#eef3fa;color:#18243a}header{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 4vw;background:#fff;border-bottom:1px solid #b8c9df}select,button{font:inherit;padding:7px;border:1px solid #9eb5d1;border-radius:7px;background:#fff}.wrap{max-width:1100px;margin:auto;padding:20px 4vw}.verse{margin:0 0 20px;padding:16px;background:#fff;border-radius:10px}.original{font:1.5rem Georgia;display:flex;flex-wrap:wrap;gap:7px}.token{border:1px solid #cad7e8}.segment{display:inline-block;margin:4px;padding:5px;background:#f1e3c8;border-radius:5px}.relation{margin:9px 0;padding:9px;border-left:4px solid #b98922;background:#f8fafc}.relation[data-status=reviewed],.relation[data-status=approved]{border-color:#35713e}.relation-controls{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.meta{font:12px ui-monospace;color:#586b84}.message{margin-left:auto;color:#35713e}@media(max-width:600px){header{flex-wrap:wrap}.message{width:100%}}
</style></head><body><header><strong>Revisión Interlineal</strong><select id="target"><option value="rv-verbo">ES · Biblia Verbo</option><option value="bsb">EN · BSB</option></select><select id="book"></select><select id="chapter"></select><button id="load">Abrir</button><span class="message" id="message"></span></header><main class="wrap" id="content"></main><script>
const $=s=>document.querySelector(s);let manifest,currentOriginal,currentAlignment;
async function json(url,options){const r=await fetch(url,options);if(!r.ok)throw Error(await r.text());return r.json()}
async function init(){manifest=await json('/data/manifest.json');$('#book').innerHTML=Object.keys(manifest.books).map(x=>`<option>${x}</option>`).join('');$('#book').onchange=chapters;chapters();}
function chapters(){const b=manifest.books[$('#book').value];$('#chapter').innerHTML=Object.keys(b.chapters).map(x=>`<option>${x}</option>`).join('')}
async function open(){const b=$('#book').value,c=$('#chapter').value,t=$('#target').value,info=manifest.books[b];[currentOriginal,currentAlignment]=await Promise.all([json('/data/'+info.chapters[c]),json('/data/'+info.alignments[t][c])]);render()}
function render(){const rels={};for(const r of currentAlignment.relations){const v=r.verse||r.id.split('.')[2];(rels[v]??=[]).push(r)}const segments=new Map(Object.values(currentAlignment.targetSegments).flat().map(x=>[x.id,x]));$('#content').innerHTML=Object.entries(currentOriginal.verses).map(([v,p])=>`<section class="verse"><h2>${currentOriginal.book} ${currentOriginal.chapter}:${v}</h2><div class="original" dir="${currentOriginal.direction}">${p.tokens.map(t=>`<button class="token" title="${t.id}">${t.surface}</button>`).join('')}</div>${(currentAlignment.targetSegments[v]||[]).map(s=>`<span class="segment">${s.text}</span>`).join('')}<div>${(rels[v]||[]).map(r=>`<article class="relation" data-status="${r.status}"><div><b>${r.originalTokens.join(', ')||'∅'}</b> ↔ ${r.verboSegments.map(x=>segments.get(x)?.text||x).join(' ')||'∅'}</div><div class="meta">${r.relation} · ${r.status} · ${r.confidence??'sin confianza'} · ${r.method}</div><div class="relation-controls">${['automatic','reviewed','approved','ambiguous','unresolved'].map(s=>`<button data-id="${r.id}" data-status="${s}">${s}</button>`).join('')}</div></article>`).join('')}</div></section>`).join('');document.querySelectorAll('[data-id][data-status]').forEach(x=>x.onclick=()=>save(x.dataset.id,x.dataset.status));}
async function save(id,status){const result=await json('/api/relation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:currentAlignment.targetBible,book:currentAlignment.book,chapter:currentAlignment.chapter,id,status})});const relation=currentAlignment.relations.find(x=>x.id===id);relation.status=status;$('#message').textContent=`Guardado ${currentAlignment.targetBible} ${id}: ${status}`;render()}
$('#load').onclick=open;init().then(open).catch(e=>$('#content').textContent=e);</script></body></html>
